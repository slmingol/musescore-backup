  <text x="352" y="112" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#8B949E">launchd</text>
  <text x="406" y="112" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#484F58">·</text>
  <text x="416" y="112" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#8B949E">macOS</text>
