    <line x1="26" y1="110" x2="210" y2="110" stroke="#1A2D42" stroke-width="0.9"/>
    <text x="168" y="94" font-family="SF Mono,Consolas,monospace" font-size="8" fill="#1A2D42">.mscz</text>
  </g>

  <!-- File 2 (middle, slight angle) -->
