    <!-- Left ear -->
    <polygon points="24,34 32,10 50,34" fill="#21262D" stroke="#3A4A5C" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="28,33 33,16 48,33" fill="#4A2040" opacity="0.9"/>
    <!-- Right ear -->
