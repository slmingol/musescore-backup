  <ellipse cx="152" cy="98"  rx="5" ry="4" fill="#334D6E" transform="rotate(-15,152,98)"/>
  <line x1="157" y1="97"  x2="157" y2="84"  stroke="#334D6E" stroke-width="1.5"/>
