  <ellipse cx="72"  cy="100" rx="5" ry="4" fill="#334D6E" transform="rotate(-15,72,100)"/>
  <line x1="77"  y1="99"  x2="77"  y2="86"  stroke="#334D6E" stroke-width="1.5"/>
  <ellipse cx="92"  cy="106" rx="5" ry="4" fill="#334D6E" transform="rotate(-15,92,106)"/>
