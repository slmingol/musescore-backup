<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
  <rect width="900" height="120" rx="8" fill="#0D1117"/>

  <!-- ===== STACKED .mscz SCORE FILES ===== -->

  <!-- File 3 (back, angled) -->
  <g transform="rotate(-5,118,100)">
    <rect x="14" y="82" width="208" height="34" rx="3" fill="#0C1822" stroke="#1A2D42" stroke-width="1.3"/>
