    <polygon points="52,33 63,16 72,33" fill="#4A2040" opacity="0.9"/>

    <!-- Eyes CLOSED -->
    <path d="M30,52 Q38,44 46,52" stroke="#3FB950" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M48,52 Q56,44 64,52" stroke="#3FB950" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <line x1="30" y1="52" x2="27" y2="56" stroke="#3FB950" stroke-width="1.4"/>
    <line x1="46" y1="52" x2="48" y2="56" stroke="#3FB950" stroke-width="1.4"/>
    <line x1="48" y1="52" x2="46" y2="56" stroke="#3FB950" stroke-width="1.4"/>
    <line x1="64" y1="52" x2="67" y2="56" stroke="#3FB950" stroke-width="1.4"/>

    <!-- Nose -->
    <polygon points="43,62 46,67 49,62 46,59" fill="#CC6699"/>

    <!-- Mouth -->
    <path d="M43,67 Q40,71 37,70" stroke="#3A4A5C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M49,67 Q52,71 55,70" stroke="#3A4A5C" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- Whiskers left -->
    <line x1="4"  y1="58" x2="34" y2="60" stroke="#8B949E" stroke-width="1.2"/>
    <line x1="4"  y1="63" x2="34" y2="63" stroke="#8B949E" stroke-width="1.2"/>
    <line x1="4"  y1="68" x2="34" y2="66" stroke="#8B949E" stroke-width="1.2"/>
    <!-- Whiskers right -->
    <line x1="58" y1="60" x2="88" y2="58" stroke="#8B949E" stroke-width="1.2"/>
    <line x1="58" y1="63" x2="88" y2="63" stroke="#8B949E" stroke-width="1.2"/>
    <line x1="58" y1="66" x2="88" y2="68" stroke="#8B949E" stroke-width="1.2"/>

    <!-- Zzz -->
    <text x="170" y="48" font-family="SF Mono,Consolas,monospace" font-size="22" font-weight="700"
          fill="#4A9EFF" opacity="0.85">z</text>
    <text x="188" y="34" font-family="SF Mono,Consolas,monospace" font-size="15" font-weight="700"
          fill="#4A9EFF" opacity="0.55">z</text>
    <text x="202" y="22" font-family="SF Mono,Consolas,monospace" font-size="10" font-weight="700"
          fill="#4A9EFF" opacity="0.3">z</text>

  </g>

  <!-- ===== RIGHT SECTION ===== -->
  <line x1="278" y1="12" x2="278" y2="143" stroke="#2A3A52" stroke-width="1"/>

  <!-- Title -->
  <text x="294" y="62" font-family="SF Mono,Consolas,monospace" font-size="26" font-weight="700">
    <tspan fill="#E6EDF3">musescore</tspan><tspan fill="#4A9EFF">-scores</tspan>
  </text>

  <!-- Subtitle -->
  <text x="294" y="82" font-family="SF Mono,Consolas,monospace" font-size="12" fill="#8B949E">Jinxey's private score archive · auto-committed on save</text>

  <!-- Rule -->
  <line x1="294" y1="95" x2="882" y2="95" stroke="#2A3A52" stroke-width="1"/>

  <!-- Badges -->
  <text x="294" y="112" font-family="SF Mono,Consolas,monospace" font-size="10" fill="#3FB950">fswatch</text>
