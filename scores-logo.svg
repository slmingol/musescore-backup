  <text x="22" y="103" font-family="serif" font-size="26" fill="#2A4060">𝄞</text>
  <!-- Notes on file staff -->
  <ellipse cx="60"  cy="88" rx="4" ry="3" fill="#334D6E" transform="rotate(-15,60,88)"/>
  <line x1="64"  y1="87" x2="64"  y2="76" stroke="#334D6E" stroke-width="1.3"/>
  <ellipse cx="76"  cy="84" rx="4" ry="3" fill="#334D6E" transform="rotate(-15,76,84)"/>
  <line x1="80"  y1="83" x2="80"  y2="72" stroke="#334D6E" stroke-width="1.3"/>
  <ellipse cx="92"  cy="91" rx="4" ry="3" fill="#334D6E" transform="rotate(-15,92,91)"/>
  <line x1="96"  y1="90" x2="96"  y2="79" stroke="#334D6E" stroke-width="1.3"/>
  <ellipse cx="108" cy="86" rx="4" ry="3" fill="#334D6E" transform="rotate(-15,108,86)"/>
  <line x1="112" y1="85" x2="112" y2="74" stroke="#334D6E" stroke-width="1.3"/>
  <!-- .mscz label on top file -->
  <text x="148" y="103" font-family="SF Mono,Consolas,monospace" font-size="9" font-weight="700" fill="#3A5878">.mscz</text>

  <!-- ===== JINXEY (scaled 1.3x around cat center) ===== -->
  <g transform="translate(105,57) scale(1.3) translate(-105,-57)">

    <!-- Tail (tighter curve to stay left of divider after scaling) -->
    <path d="M158 74 C 186 80 190 58 170 52"
